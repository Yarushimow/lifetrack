<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LifeTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  :root{
    --bg0:#05060f; --bg1:#0a0c1e; --bg2:#10132e;
    --surface:rgba(22,26,54,.55); --surface2:rgba(30,35,70,.5);
    --stroke:rgba(130,150,255,.14); --stroke2:rgba(150,170,255,.28);
    --text:#eef1ff; --text2:#a6abd8; --text3:#6b6f9c;
    --accent:#7c5cff; --accent2:#37d9d4; --accent3:#ff5c9d;
    --glow:rgba(124,92,255,.55);
    --ok:#5df0a8; --ok-bg:rgba(93,240,168,.12);
    --bad:#ff6b8a; --bad-bg:rgba(255,107,138,.12);
    --r-md:12px; --r-lg:18px; --r-xl:24px;
    --fdisp:'Space Grotesk',sans-serif; --fbody:'Outfit',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;color:var(--text);font-family:var(--fbody);overflow-x:hidden;}
  html{background:#070613;}
  body{position:relative;background:#070613;}
  body::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;min-height:100vh;z-index:-3;background:radial-gradient(120% 60% at 50% 0%,#120f2e 0%,#0a0a1c 40%,#070613 75%);}
  /* starfield canvas — transparent, just stars + comets over the body gradient */
  #sky{position:fixed;inset:0;z-index:-2;width:100%;height:100%;}
  /* aurora gradient blobs */
  .aurora{position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.6;pointer-events:none;animation:drift 22s ease-in-out infinite alternate;}
  .a1{width:480px;height:480px;background:radial-gradient(circle,#7c5cff,transparent 70%);top:-140px;left:-120px;}
  .a2{width:420px;height:420px;background:radial-gradient(circle,#37d9d4,transparent 70%);bottom:-160px;right:-140px;animation-delay:-8s;}
  .a3{width:340px;height:340px;background:radial-gradient(circle,#ff5c9d,transparent 70%);top:42%;right:-120px;animation-delay:-14s;opacity:.4;}
  .a4{width:300px;height:300px;background:radial-gradient(circle,#4a6bff,transparent 70%);top:20%;left:-100px;animation-delay:-18s;opacity:.35;}
  @keyframes drift{0%{transform:translate(0,0) scale(1);}100%{transform:translate(40px,-30px) scale(1.15);}}

  .lt-app{position:relative;max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 48px);}
  .lt-head{display:flex;align-items:center;gap:10px;margin-bottom:2px;animation:dropIn .7s cubic-bezier(.2,.8,.2,1) both;}
  .lt-logo{font-family:var(--fdisp);font-size:24px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(100deg,#fff 10%,#a78bff 45%,#37d9d4 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .lt-orbit{width:30px;height:30px;flex:0 0 auto;position:relative;}
  .lt-orbit::before{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--stroke2);}
  .lt-orbit::after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent2);top:-2px;left:50%;margin-left:-3.5px;box-shadow:0 0 10px var(--accent2);animation:orbit 4s linear infinite;transform-origin:3.5px 17px;}
  @keyframes orbit{to{transform:rotate(360deg);}}
  .lt-date{font-size:12.5px;color:var(--text3);margin:0 0 16px;letter-spacing:.3px;text-transform:capitalize;animation:dropIn .7s .05s cubic-bezier(.2,.8,.2,1) both;}

  .lt-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none;animation:dropIn .7s .1s cubic-bezier(.2,.8,.2,1) both;}
  .lt-tabs::-webkit-scrollbar{display:none;}
  .lt-tab{flex:0 0 auto;border:1px solid var(--stroke);background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--r-lg);padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;color:var(--text2);font-family:inherit;transition:all .35s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;}
  .lt-tab i{font-size:16px;}
  .lt-tab:active{transform:scale(.93);}
  .lt-tab.active{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:0 6px 24px -6px var(--glow),0 0 0 1px rgba(255,255,255,.08) inset;transform:translateY(-1px);}

  .lt-card{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-xl);padding:18px 20px;margin-bottom:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 32px -16px rgba(0,0,0,.6);position:relative;overflow:hidden;}
  .lt-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--stroke2),transparent);}
  .stagger>*{animation:rise .6s cubic-bezier(.2,.85,.25,1) both;}
  .stagger>*:nth-child(1){animation-delay:.04s;}
  .stagger>*:nth-child(2){animation-delay:.1s;}
  .stagger>*:nth-child(3){animation-delay:.16s;}
  .stagger>*:nth-child(4){animation-delay:.22s;}
  .stagger>*:nth-child(5){animation-delay:.28s;}
  .stagger>*:nth-child(6){animation-delay:.34s;}
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes dropIn{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}

  .lt-card h3{font-family:var(--fdisp);font-size:16px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:9px;letter-spacing:-.2px;}
  .lt-card h3 i{color:var(--accent2);font-size:19px;filter:drop-shadow(0 0 6px rgba(55,217,212,.5));}
  .lt-row{display:flex;gap:11px;margin-bottom:12px;}
  .lt-field{flex:1;min-width:0;}
  label{font-size:12.5px;color:var(--text2);display:block;margin-bottom:5px;font-weight:400;letter-spacing:.2px;}
  input{width:100%;height:42px;padding:0 14px;font-size:15px;font-family:inherit;color:var(--text);background:rgba(10,12,30,.5);border:1px solid var(--stroke);border-radius:var(--r-md);transition:all .3s;}
  input[readonly]{background:rgba(124,92,255,.07);color:var(--accent2);font-weight:500;}
  input::placeholder{color:var(--text3);}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.2),0 0 20px -6px var(--glow);background:rgba(10,12,30,.7);}
  input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.7);}
  button{font-family:inherit;}
  .lt-btn{width:100%;height:46px;margin-top:6px;border:none;background:linear-gradient(120deg,var(--accent),var(--accent3));color:#fff;border-radius:var(--r-md);font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.2px;box-shadow:0 8px 28px -10px var(--glow);transition:all .25s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;}
  .lt-btn i{font-size:18px;}
  .lt-btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px -10px var(--glow);}
  .lt-btn:active{transform:scale(.97);}
  .lt-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.25),transparent 70%);transform:translateX(-120%);}
  .lt-btn:hover::after{animation:sheen .7s;}
  @keyframes sheen{to{transform:translateX(120%);}}

  .lt-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:14px;}
  .lt-metric{background:var(--surface2);border:1px solid var(--stroke);border-radius:var(--r-lg);padding:14px 16px;position:relative;overflow:hidden;transition:transform .3s;}
  .lt-metric:hover{transform:translateY(-2px);}
  .lt-metric::after{content:'';position:absolute;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);top:-20px;right:-20px;opacity:.4;}
  .lt-metric .lab{font-size:11.5px;color:var(--text2);margin:0;text-transform:uppercase;letter-spacing:.6px;font-weight:500;}
  .lt-metric .val{font-family:var(--fdisp);font-size:26px;font-weight:700;margin:3px 0 0;letter-spacing:-.5px;}
  .lt-metric .val small{font-size:13px;color:var(--text3);font-weight:400;}

  .lt-list,.lt-cmp,.lt-lib{list-style:none;padding:0;margin:10px 0 0;}
  .lt-list li{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:10px 0;border-top:1px solid var(--stroke);animation:rise .5s cubic-bezier(.2,.85,.25,1) both;}
  .lt-list .meta{color:var(--text3);font-size:12px;}
  .lt-del{background:none;border:none;color:var(--bad);cursor:pointer;font-size:17px;padding:3px 7px;border-radius:8px;transition:all .2s;}
  .lt-del:hover{background:var(--bad-bg);transform:scale(1.1);}
  .lt-empty{font-size:13px;color:var(--text3);text-align:center;padding:20px 0;}

  .lt-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;}
  .lt-chip{border:1px solid var(--stroke);background:rgba(10,12,30,.4);color:var(--text2);border-radius:var(--r-md);padding:9px 15px;font-size:14px;font-weight:500;cursor:pointer;transition:all .28s cubic-bezier(.2,.8,.2,1);}
  .lt-chip:active{transform:scale(.92);}
  .lt-chip.sel{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 16px -6px var(--glow);transform:translateY(-1px);}

  .lt-hrs{display:flex;align-items:center;gap:14px;margin:6px 0;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 0 14px var(--glow),0 2px 6px rgba(0,0,0,.4);border:2px solid var(--accent);}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;border:2px solid var(--accent);box-shadow:0 0 14px var(--glow);}
  .lt-hrs output{font-family:var(--fdisp);font-size:24px;font-weight:700;min-width:62px;}
  .lt-hrs output small{font-size:13px;color:var(--text3);font-weight:400;}

  .lt-seg{display:flex;gap:8px;margin-bottom:16px;background:rgba(10,12,30,.4);padding:5px;border-radius:var(--r-md);border:1px solid var(--stroke);}
  .lt-seg button{flex:1;border:none;background:transparent;color:var(--text2);border-radius:9px;padding:10px;font-size:13px;font-weight:500;cursor:pointer;transition:all .3s;}
  .lt-seg button.sel{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px -6px var(--glow);}

  .lt-calc{font-size:13.5px;color:var(--text2);margin:2px 0 4px;}
  .lt-calc b{font-family:var(--fdisp);color:var(--accent2);font-weight:600;}

  .lt-cmp li{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:11px 0;border-top:1px solid var(--stroke);}
  .lt-cmp li:first-child{border-top:none;}
  .lt-cmp .name{font-weight:500;}
  .lt-cmp .nums{display:flex;align-items:center;gap:10px;}
  .lt-cmp .now{font-family:var(--fdisp);font-size:16px;font-weight:600;min-width:18px;text-align:right;}
  .lt-cmp .prev{font-size:12px;color:var(--text3);}
  .lt-delta{font-size:12px;font-weight:600;padding:3px 9px;border-radius:9px;min-width:40px;text-align:center;}
  .d-up{background:var(--ok-bg);color:var(--ok);}
  .d-down{background:var(--bad-bg);color:var(--bad);}
  .d-flat{background:var(--surface2);color:var(--text3);}

  .lt-lib li{display:flex;align-items:center;justify-content:space-between;gap:9px;font-size:13.5px;padding:11px 8px;border-top:1px solid var(--stroke);border-radius:var(--r-md);transition:background .2s;animation:rise .5s cubic-bezier(.2,.85,.25,1) both;}
  .lt-lib li:hover{background:rgba(124,92,255,.06);}
  .lt-lib .ln{flex:1;min-width:0;cursor:pointer;}
  .lt-lib .ln b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lt-lib .ln span{color:var(--text3);font-size:12px;}
  .lt-lib .lpick{color:var(--accent2);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;}
  .lt-hint{font-size:12px;color:var(--text3);margin:8px 0 0;line-height:1.5;}
  .lt-sel-food{background:linear-gradient(120deg,rgba(124,92,255,.18),rgba(55,217,212,.12));border:1px solid var(--stroke2);border-radius:var(--r-md);padding:12px 14px;margin:12px 0;font-size:13px;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:8px;animation:rise .45s cubic-bezier(.2,.85,.25,1) both;}
  .lt-sel-food .lt-del{color:var(--accent2);}

  .pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}

  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;}.lt-orbit::after,.aurora{animation:none;}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div><div class="aurora a4"></div>
<div class="lt-app">
  <div class="lt-head"><span class="lt-orbit"></span><span class="lt-logo">LifeTrack</span></div>
  <p class="lt-date" id="lt-today"></p>
  <div class="lt-tabs" id="lt-tabs"></div>
  <div id="lt-view"></div>
</div>
<script>
/* ===== Starfield + comets canvas ===== */
(function(){
  const c=document.getElementById('sky'),x=c.getContext('2d');
  let w,h,stars=[],comets=[],shoots=[];
  function size(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  size();addEventListener('resize',size);
  const W=()=>w/devicePixelRatio,H=()=>h/devicePixelRatio;
  for(let i=0;i<220;i++)stars.push({x:Math.random()*W(),y:Math.random()*H(),r:Math.random()*1.3+.2,t:Math.random()*Math.PI*2,sp:Math.random()*.02+.005,big:Math.random()<.08});
  function comet(){comets.push({x:-50,y:Math.random()*H()*.6,vx:Math.random()*2+2.5,vy:Math.random()*.8+.4,life:1});}
  // shooting star triggered by interaction
  window.__shoot=(px,py)=>{for(let k=0;k<3;k++)shoots.push({x:px||Math.random()*W(),y:py||Math.random()*H()*.5,vx:(Math.random()*-3-3),vy:(Math.random()*2+1.5),life:1,len:Math.random()*40+30});};
  setInterval(()=>{if(comets.length<2&&Math.random()<.5)comet();},3500);
  function loop(){
    x.clearRect(0,0,W(),H());
    // stars twinkle
    stars.forEach(s=>{s.t+=s.sp;const a=.4+Math.sin(s.t)*.4;
      if(s.big){
        x.globalAlpha=a*.5;const hg=x.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*6);hg.addColorStop(0,'rgba(180,200,255,.9)');hg.addColorStop(1,'rgba(180,200,255,0)');x.fillStyle=hg;x.beginPath();x.arc(s.x,s.y,s.r*6,0,7);x.fill();
        x.globalAlpha=a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r*1.4,0,7);x.fill();
      }else{
        x.globalAlpha=a;x.fillStyle='#cfd6ff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();
      }
    });
    x.globalAlpha=1;
    // comets
    comets=comets.filter(cm=>{
      cm.x+=cm.vx;cm.y+=cm.vy;
      const tg=x.createLinearGradient(cm.x,cm.y,cm.x-60,cm.y-22);tg.addColorStop(0,'rgba(160,180,255,.9)');tg.addColorStop(1,'rgba(160,180,255,0)');
      x.strokeStyle=tg;x.lineWidth=2;x.beginPath();x.moveTo(cm.x,cm.y);x.lineTo(cm.x-60,cm.y-22);x.stroke();
      x.fillStyle='#fff';x.globalAlpha=.95;x.beginPath();x.arc(cm.x,cm.y,2,0,7);x.fill();x.globalAlpha=1;
      return cm.x<W()+80&&cm.y<H()+80;
    });
    // shooting stars (interaction)
    shoots=shoots.filter(sh=>{
      sh.x+=sh.vx;sh.y+=sh.vy;sh.life-=.02;
      const tg=x.createLinearGradient(sh.x,sh.y,sh.x-sh.vx*sh.len/4,sh.y-sh.vy*sh.len/4);
      tg.addColorStop(0,`rgba(55,217,212,${sh.life})`);tg.addColorStop(1,'rgba(55,217,212,0)');
      x.strokeStyle=tg;x.lineWidth=2;x.beginPath();x.moveTo(sh.x,sh.y);x.lineTo(sh.x-sh.vx*sh.len/4,sh.y-sh.vy*sh.len/4);x.stroke();
      return sh.life>0;
    });
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ===== App logic ===== */
(function(){
  const TABS=[
    {id:'home',icon:'ti-planet',label:'Résumé'},
    {id:'sleep',icon:'ti-moon-stars',label:'Sommeil'},
    {id:'gym',icon:'ti-barbell',label:'Salle'},
    {id:'study',icon:'ti-book',label:'Études'},
    {id:'food',icon:'ti-apple',label:'Nutrition'},
  ];
  const GYM_CATS=['Upper','Lower','Full body'];
  const KEY='lifetrack:data';
  let active='home';
  let store={sleep:[],gym:[],study:[],food:[],foodLib:[]};

  const view=document.getElementById('lt-view');
  const tabsEl=document.getElementById('lt-tabs');
  const now=new Date();
  const today=now.toISOString().slice(0,10);
  document.getElementById('lt-today').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

  function mondayOf(d){const a=new Date(d+'T00:00:00');const day=(a.getDay()+6)%7;a.setDate(a.getDate()-day);return a.toISOString().slice(0,10);}
  const thisWeek=mondayOf(today);
  const lastWeek=(()=>{const a=new Date(thisWeek+'T00:00:00');a.setDate(a.getDate()-7);return a.toISOString().slice(0,10);})();
  function inWeek(date,ws0){const ws=new Date(ws0+'T00:00:00'),we=new Date(ws);we.setDate(we.getDate()+7);const d=new Date(date+'T00:00:00');return d>=ws&&d<we;}

  function load(){try{const r=localStorage.getItem(KEY);if(r)store=Object.assign(store,JSON.parse(r));}catch(e){}if(!Array.isArray(store.foodLib))store.foodLib=[];render();}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){console.error(e);}}

  const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const r1=n=>Math.round(n*10)/10;
  const todayItems=arr=>arr.filter(x=>x.date===today);
  function deltaBadge(nw,prev){const d=nw-prev;if(d>0)return `<span class="lt-delta d-up">+${r1(d)}</span>`;if(d<0)return `<span class="lt-delta d-down">${r1(d)}</span>`;return `<span class="lt-delta d-flat">=</span>`;}

  function renderTabs(){
    tabsEl.innerHTML=TABS.map(t=>`<button class="lt-tab ${t.id===active?'active':''}" data-tab="${t.id}"><i class="ti ${t.icon}"></i>${t.label}</button>`).join('');
    tabsEl.querySelectorAll('.lt-tab').forEach(b=>b.onclick=(e)=>{
      const rect=b.getBoundingClientRect();window.__shoot(rect.left+rect.width/2,rect.top+rect.height/2);
      active=b.dataset.tab;render();
    });
  }
  function fmtDate(d){return d===today?"Aujourd'hui":new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}

  /* animated counter */
  function animateCounts(){
    view.querySelectorAll('[data-count]').forEach(el=>{
      const target=+el.dataset.count;if(isNaN(target))return;
      const dec=el.dataset.dec==='1';let cur=0;const dur=700;const t0=performance.now();
      function step(t){const p=Math.min((t-t0)/dur,1);const e=1-Math.pow(1-p,3);cur=target*e;el.textContent=dec?r1(cur):Math.round(cur);if(p<1)requestAnimationFrame(step);else el.textContent=dec?r1(target):Math.round(target);}
      requestAnimationFrame(step);
    });
  }

  function home(){
    const lastSleep=store.sleep[store.sleep.length-1];
    const g=todayItems(store.gym).length;
    const st=todayItems(store.study).reduce((a,x)=>a+(+x.minutes||0),0);
    const f=todayItems(store.food);
    const kcal=f.reduce((a,x)=>a+(+x.kcal||0),0);
    const prot=f.reduce((a,x)=>a+(+x.protein||0),0);
    return `<div class="stagger">
      <div class="lt-metrics">
        <div class="lt-metric"><p class="lab">Sommeil</p><p class="val"><span data-count="${lastSleep?r1(lastSleep.hours):0}" data-dec="1">0</span> <small>h</small></p></div>
        <div class="lt-metric"><p class="lab">Séances du jour</p><p class="val"><span data-count="${g}">0</span></p></div>
        <div class="lt-metric"><p class="lab">Études du jour</p><p class="val"><span data-count="${st}">0</span> <small>min</small></p></div>
        <div class="lt-metric"><p class="lab">Protéines</p><p class="val"><span data-count="${Math.round(prot)}">0</span> <small>g</small></p></div>
      </div>
      <div class="lt-card"><h3><i class="ti ti-flame"></i>Nutrition du jour</h3>
        <div class="lt-metrics" style="margin:0">
          <div class="lt-metric"><p class="lab">Calories</p><p class="val"><span data-count="${Math.round(kcal)}">0</span> <small>kcal</small></p></div>
          <div class="lt-metric"><p class="lab">Repas loggés</p><p class="val"><span data-count="${f.length}">0</span></p></div>
        </div></div>
      <div class="lt-card"><h3><i class="ti ti-sparkles"></i>Activité récente</h3>${recentFeed()}</div>
    </div>`;
  }
  function recentFeed(){
    const all=[
      ...store.sleep.map(x=>({d:x.date,t:`Sommeil ${r1(x.hours)}h${x.quality?` · qualité ${x.quality}/5`:''}`,i:'ti-moon-stars'})),
      ...store.gym.map(x=>({d:x.date,t:`Salle · ${esc(x.cat||x.type||'séance')}${x.duration?` ${x.duration}min`:''}`,i:'ti-barbell'})),
      ...store.study.map(x=>({d:x.date,t:`Études · ${esc(x.subject||'révisions')} ${x.minutes}min`,i:'ti-book'})),
      ...store.food.map(x=>({d:x.date,t:`${esc(x.name)} · ${Math.round(x.kcal||0)}kcal`,i:'ti-apple'})),
    ].slice(-40).reverse().slice(0,8);
    if(!all.length)return `<p class="lt-empty">Le cosmos est vide. Logge ta première donnée ✦</p>`;
    return `<ul class="lt-list">${all.map((x,i)=>`<li style="animation-delay:${i*.05}s"><span><i class="ti ${x.i}" style="font-size:15px;vertical-align:-2px;margin-right:9px;color:var(--accent2)"></i>${x.t}</span><span class="meta">${fmtDate(x.d)}</span></li>`).join('')}</ul>`;
  }

  let sleepQ=0,sleepH=8,sleepMode='times';
  function calcHours(bed,wake){if(!bed||!wake)return null;const [bh,bm]=bed.split(':').map(Number),[wh,wm]=wake.split(':').map(Number);let h=(wh*60+wm)-(bh*60+bm);if(h<=0)h+=1440;return h/60;}
  function weekSleep(ws){const arr=store.sleep.filter(x=>inWeek(x.date,ws));if(!arr.length)return{avg:0,n:0};return{avg:arr.reduce((a,x)=>a+x.hours,0)/arr.length,n:arr.length};}
  function sleepStatsCard(){
    const tw=weekSleep(thisWeek),lw=weekSleep(lastWeek);
    return `<div class="lt-card"><h3><i class="ti ti-chart-line"></i>Moyenne hebdo</h3>
      <div class="lt-metrics" style="margin-bottom:8px">
        <div class="lt-metric"><p class="lab">Cette semaine</p><p class="val"><span data-count="${tw.n?r1(tw.avg):0}" data-dec="1">0</span> <small>h/nuit</small></p></div>
        <div class="lt-metric"><p class="lab">Sem. dernière</p><p class="val"><span data-count="${lw.n?r1(lw.avg):0}" data-dec="1">0</span> <small>h/nuit</small></p></div>
      </div>
      <ul class="lt-cmp">
        <li><span class="name">Évolution</span><span class="nums">${tw.n&&lw.n?deltaBadge(r1(tw.avg),r1(lw.avg))+'<span class="prev">vs sem. dernière</span>':'<span class="prev">Pas encore comparable</span>'}</span></li>
        <li><span class="name">Nuits loggées</span><span class="nums"><span class="now">${tw.n}</span><span class="prev">contre ${lw.n}</span></span></li>
      </ul></div>`;
  }
  function sleep(){
    const modeUI=sleepMode==='times'?`
      <div class="lt-row">
        <div class="lt-field"><label>Au lit à</label><input type="time" id="s-bed" value="23:00"></div>
        <div class="lt-field"><label>Réveil à</label><input type="time" id="s-wake" value="07:00"></div>
      </div><p class="lt-calc" id="s-calc">Durée : <b>8h</b></p>`:`
      <label>Heures dormies (estimation)</label>
      <div class="lt-hrs"><input type="range" id="s-h" min="0" max="14" step="0.5" value="${sleepH}"><output id="s-hout">${r1(sleepH)} <small>h</small></output></div>`;
    return `<div class="stagger">
      <div class="lt-card"><h3><i class="ti ti-moon-stars"></i>Logger une nuit</h3>
        <div class="lt-seg"><button data-mode="times" class="${sleepMode==='times'?'sel':''}">Coucher / réveil</button><button data-mode="estimate" class="${sleepMode==='estimate'?'sel':''}">Estimation</button></div>
        ${modeUI}
        <label style="margin-top:10px">Qualité ressentie</label>
        <div class="lt-chips" id="s-qual">${[1,2,3,4,5].map(n=>`<button class="lt-chip ${n===sleepQ?'sel':''}" data-q="${n}">${n}</button>`).join('')}</div>
        <button class="lt-btn" id="s-add" style="margin-top:16px"><i class="ti ti-plus"></i> Ajouter</button></div>
      ${sleepStatsCard()}
      ${listCard('sleep',x=>`${r1(x.hours)}h${x.bed?` (${x.bed}→${x.wake})`:''}${x.quality?` · ${x.quality}/5`:''}`)}
    </div>`;
  }

  let gymCat='Upper';
  function weekGym(ws){const arr=store.gym.filter(x=>inWeek(x.date,ws));const out={total:arr.length,minutes:arr.reduce((a,x)=>a+(+x.duration||0),0),cats:{}};GYM_CATS.forEach(c=>out.cats[c]=0);arr.forEach(x=>{const c=x.cat||'Full body';out.cats[c]=(out.cats[c]||0)+1;});return out;}
  function gymStatsCard(){
    const tw=weekGym(thisWeek),lw=weekGym(lastWeek);
    const rows=GYM_CATS.map(c=>`<li><span class="name">${c}</span><span class="nums"><span class="now">${tw.cats[c]}</span><span class="prev">sem. dern. ${lw.cats[c]}</span>${deltaBadge(tw.cats[c],lw.cats[c])}</span></li>`).join('');
    return `<div class="lt-card"><h3><i class="ti ti-chart-bar"></i>Cette semaine vs dernière</h3>
      <div class="lt-metrics" style="margin-bottom:10px">
        <div class="lt-metric"><p class="lab">Séances</p><p class="val"><span data-count="${tw.total}">0</span> <small>(${lw.total} av.)</small></p></div>
        <div class="lt-metric"><p class="lab">Temps total</p><p class="val"><span data-count="${tw.minutes}">0</span> <small>min</small></p></div>
      </div>
      <ul class="lt-cmp">${rows}
        <li><span class="name">Temps total</span><span class="nums"><span class="now">${tw.minutes}m</span><span class="prev">sem. dern. ${lw.minutes}m</span>${deltaBadge(tw.minutes,lw.minutes)}</span></li>
      </ul></div>`;
  }
  function gym(){
    return `<div class="stagger">
      <div class="lt-card"><h3><i class="ti ti-barbell"></i>Logger une séance</h3>
        <label>Catégorie</label>
        <div class="lt-chips" id="g-cat">${GYM_CATS.map(c=>`<button class="lt-chip ${c===gymCat?'sel':''}" data-cat="${c}">${c}</button>`).join('')}</div>
        <div class="lt-row" style="margin-top:12px">
          <div class="lt-field"><label>Durée (min)</label><input id="g-dur" type="number" inputmode="numeric" placeholder="60"></div>
          <div class="lt-field"><label>Note / PR</label><input id="g-note" placeholder="dév. couché 60kg x8"></div>
        </div>
        <button class="lt-btn" id="g-add"><i class="ti ti-plus"></i> Ajouter</button></div>
      ${gymStatsCard()}
      ${listCard('gym',x=>`${esc(x.cat||x.type||'séance')}${x.duration?` · ${x.duration}min`:''}${x.note?` · ${esc(x.note)}`:''}`)}
    </div>`;
  }

  function weekStudy(ws){const arr=store.study.filter(x=>inWeek(x.date,ws));return{minutes:arr.reduce((a,x)=>a+(+x.minutes||0),0),n:arr.length};}
  function studyStatsCard(){
    const tw=weekStudy(thisWeek),lw=weekStudy(lastWeek);
    return `<div class="lt-card"><h3><i class="ti ti-chart-bar"></i>Cette semaine vs dernière</h3>
      <ul class="lt-cmp">
        <li><span class="name">Temps total</span><span class="nums"><span class="now">${tw.minutes}m</span><span class="prev">sem. dern. ${lw.minutes}m</span>${deltaBadge(tw.minutes,lw.minutes)}</span></li>
        <li><span class="name">Sessions</span><span class="nums"><span class="now">${tw.n}</span><span class="prev">sem. dern. ${lw.n}</span>${deltaBadge(tw.n,lw.n)}</span></li>
      </ul></div>`;
  }
  function study(){
    return `<div class="stagger">
      <div class="lt-card"><h3><i class="ti ti-book"></i>Logger une session</h3>
        <div class="lt-row">
          <div class="lt-field"><label>Matière</label><input id="t-subj" placeholder="Maths / Info / Physique…"></div>
          <div class="lt-field" style="flex:0 0 100px"><label>Minutes</label><input id="t-min" type="number" inputmode="numeric" placeholder="45"></div>
        </div>
        <button class="lt-btn" id="t-add"><i class="ti ti-plus"></i> Ajouter</button></div>
      ${studyStatsCard()}
      ${listCard('study',x=>`${esc(x.subject||'révisions')} · ${x.minutes}min`)}
    </div>`;
  }

  let selFood=null,foodQty=100,libFilter='';
  function food(){
    const f=todayItems(store.food);
    const kcal=f.reduce((a,x)=>a+(+x.kcal||0),0);
    const prot=f.reduce((a,x)=>a+(+x.protein||0),0);
    const lib=store.foodLib.map((x,i)=>({...x,_i:i})).filter(x=>!libFilter||x.name.toLowerCase().includes(libFilter.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
    const libUI=store.foodLib.length===0
      ?`<p class="lt-empty">Ta bibliothèque est vide. Ajoute ton premier aliment (valeurs / 100g) — il sera mémorisé ✦</p>`
      :`<input id="f-filter" placeholder="Filtrer mes aliments…" value="${esc(libFilter)}" style="margin-bottom:6px">
        <ul class="lt-lib">${lib.map((x,i)=>`<li style="animation-delay:${i*.04}s"><span class="ln" data-pick="${x._i}"><b>${esc(x.name)}</b><span>${Math.round(x.kcal100)} kcal · ${r1(x.prot100)}g prot / 100g</span></span><span class="lpick" data-pick="${x._i}">Utiliser</span><button class="lt-del" data-libdel="${x._i}" aria-label="Supprimer"><i class="ti ti-trash"></i></button></li>`).join('')}</ul>`;
    let selUI='';
    if(selFood!=null&&store.foodLib[selFood]){
      const sf=store.foodLib[selFood];
      selUI=`<div class="lt-sel-food"><span><b>${esc(sf.name)}</b> · ${Math.round(sf.kcal100)}kcal / ${r1(sf.prot100)}g / 100g</span><button class="lt-del" id="f-clear" aria-label="Retirer"><i class="ti ti-x"></i></button></div>
        <div class="lt-row"><div class="lt-field"><label>Quantité (g)</label><input id="f-qty" type="number" inputmode="numeric" value="${foodQty}"></div><div class="lt-field"><label>= calculé</label><input id="f-calc" value="${Math.round(sf.kcal100*foodQty/100)} kcal · ${r1(sf.prot100*foodQty/100)}g" readonly></div></div>
        <button class="lt-btn" id="f-add-sel"><i class="ti ti-plus"></i> Ajouter au journal</button>`;
    }
    return `<div class="stagger">
      <div class="lt-metrics">
        <div class="lt-metric"><p class="lab">Calories du jour</p><p class="val"><span data-count="${Math.round(kcal)}">0</span> <small>kcal</small></p></div>
        <div class="lt-metric"><p class="lab">Protéines du jour</p><p class="val"><span data-count="${Math.round(prot)}">0</span> <small>g</small></p></div>
      </div>
      <div class="lt-card"><h3><i class="ti ti-books"></i>Mes aliments</h3>${libUI}${selUI}</div>
      <div class="lt-card"><h3><i class="ti ti-plus"></i>Nouvel aliment</h3>
        <div class="lt-row"><div class="lt-field"><label>Nom</label><input id="nf-name" placeholder="Flocons d'avoine"></div></div>
        <div class="lt-row"><div class="lt-field"><label>Kcal / 100g</label><input id="nf-kcal" type="number" inputmode="numeric" placeholder="389"></div><div class="lt-field"><label>Protéines / 100g</label><input id="nf-prot" type="number" inputmode="numeric" placeholder="13"></div></div>
        <button class="lt-btn" id="nf-add"><i class="ti ti-bookmark"></i> Mémoriser</button>
        <p class="lt-hint">Valeurs pour 100g (au dos de l'emballage). Réutilisable d'un clic ensuite.</p></div>
      <div class="lt-card"><h3><i class="ti ti-edit"></i>Ajout ponctuel</h3>
        <div class="lt-row"><div class="lt-field"><label>Aliment / repas</label><input id="f-name" placeholder="Repas resto"></div></div>
        <div class="lt-row"><div class="lt-field"><label>Calories</label><input id="f-kcal" type="number" inputmode="numeric" placeholder="650"></div><div class="lt-field"><label>Protéines (g)</label><input id="f-prot" type="number" inputmode="numeric" placeholder="40"></div></div>
        <button class="lt-btn" id="f-add"><i class="ti ti-plus"></i> Ajouter</button></div>
      ${listCard('food',x=>`${esc(x.name)} · ${Math.round(x.kcal||0)}kcal · ${Math.round(x.protein||0)}g prot`)}
    </div>`;
  }

  function listCard(key,fmt){
    const items=store[key].slice().reverse();
    const body=items.length?`<ul class="lt-list">${items.map((x,ri)=>{const idx=store[key].length-1-ri;return `<li style="animation-delay:${ri*.04}s"><span>${fmt(x)}</span><span style="display:flex;align-items:center;gap:8px"><span class="meta">${fmtDate(x.date)}</span><button class="lt-del" data-key="${key}" data-idx="${idx}" aria-label="Supprimer"><i class="ti ti-trash"></i></button></span></li>`;}).join('')}</ul>`:`<p class="lt-empty">Aucune entrée pour l'instant.</p>`;
    return `<div class="lt-card"><h3><i class="ti ti-list"></i>Historique</h3>${body}</div>`;
  }

  function flash(){window.__shoot();}

  function bind(){
    view.querySelectorAll('.lt-del[data-key]').forEach(b=>b.onclick=()=>{store[b.dataset.key].splice(+b.dataset.idx,1);save();render();});
    if(active==='sleep'){
      view.querySelectorAll('.lt-seg button').forEach(b=>b.onclick=()=>{sleepMode=b.dataset.mode;render();});
      view.querySelectorAll('#s-qual .lt-chip').forEach(c=>c.onclick=()=>{sleepQ=+c.dataset.q;render();});
      if(sleepMode==='times'){const upd=()=>{const h=calcHours(view.querySelector('#s-bed').value,view.querySelector('#s-wake').value);view.querySelector('#s-calc').innerHTML=`Durée : <b>${h!=null?r1(h)+'h':'—'}</b>`;};view.querySelector('#s-bed').oninput=upd;view.querySelector('#s-wake').oninput=upd;}
      else{const sl=view.querySelector('#s-h');sl.oninput=()=>{sleepH=+sl.value;view.querySelector('#s-hout').innerHTML=`${r1(sleepH)} <small>h</small>`;};}
      view.querySelector('#s-add').onclick=()=>{let e;if(sleepMode==='times'){const bed=view.querySelector('#s-bed').value,wake=view.querySelector('#s-wake').value;const h=calcHours(bed,wake);if(h==null)return;e={date:today,hours:r1(h),bed,wake,quality:sleepQ||null};}else{e={date:today,hours:r1(sleepH),quality:sleepQ||null};}store.sleep.push(e);sleepQ=0;sleepH=8;flash();save();render();};
    }
    if(active==='gym'){
      view.querySelectorAll('#g-cat .lt-chip').forEach(c=>c.onclick=()=>{gymCat=c.dataset.cat;render();});
      view.querySelector('#g-add').onclick=()=>{const duration=+view.querySelector('#g-dur').value||null;const note=view.querySelector('#g-note').value.trim();store.gym.push({date:today,cat:gymCat,duration,note});flash();save();render();};
    }
    if(active==='study'){
      view.querySelector('#t-add').onclick=()=>{const subject=view.querySelector('#t-subj').value.trim();const minutes=+view.querySelector('#t-min').value||0;if(!minutes)return;store.study.push({date:today,subject,minutes});flash();save();render();};
    }
    if(active==='food'){
      const filt=view.querySelector('#f-filter');
      if(filt)filt.oninput=()=>{libFilter=filt.value;const v=filt.value;render();const f2=view.querySelector('#f-filter');if(f2){f2.focus();f2.setSelectionRange(v.length,v.length);}};
      view.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{selFood=+el.dataset.pick;foodQty=100;render();});
      view.querySelectorAll('[data-libdel]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();const i=+el.dataset.libdel;store.foodLib.splice(i,1);if(selFood===i)selFood=null;else if(selFood>i)selFood--;save();render();});
      if(selFood!=null&&store.foodLib[selFood]){const sf=store.foodLib[selFood];const qty=view.querySelector('#f-qty');qty.oninput=()=>{foodQty=+qty.value||0;view.querySelector('#f-calc').value=`${Math.round(sf.kcal100*foodQty/100)} kcal · ${r1(sf.prot100*foodQty/100)}g`;};view.querySelector('#f-clear').onclick=()=>{selFood=null;render();};view.querySelector('#f-add-sel').onclick=()=>{if(!foodQty)return;store.food.push({date:today,name:`${sf.name} (${foodQty}g)`,kcal:Math.round(sf.kcal100*foodQty/100),protein:r1(sf.prot100*foodQty/100)});selFood=null;foodQty=100;flash();save();render();};}
      view.querySelector('#nf-add').onclick=()=>{const name=view.querySelector('#nf-name').value.trim();const k=+view.querySelector('#nf-kcal').value;const p=+view.querySelector('#nf-prot').value;if(!name||isNaN(k)||isNaN(p))return;store.foodLib.push({name,kcal100:k,prot100:p});flash();save();render();};
      view.querySelector('#f-add').onclick=()=>{const name=view.querySelector('#f-name').value.trim();if(!name)return;store.food.push({date:today,name,kcal:+view.querySelector('#f-kcal').value||0,protein:+view.querySelector('#f-prot').value||0});flash();save();render();};
    }
  }

  function render(){renderTabs();view.innerHTML=({home,sleep,gym,study,food})[active]();bind();animateCounts();}
  load();
})();
</script>
</body>
</html>
